name: Verify isolated OpenCV vision prototype
on:
  push:
    branches: [fix/opencv-quality-receipt-20261026]
  pull_request:
    paths:
      - 'experiments/carli-vision/**'
      - '.github/workflows/opencv-vision.yml'
jobs:
  python-vision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/carli-vision/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r experiments/carli-vision/requirements.txt
      - name: Runtime versions
        run: python -c "import sys, cv2, numpy; print(sys.version); print('OpenCV', cv2.__version__); print('numpy', numpy.__version__); assert cv2.__version__.split('.')[0] == '5'"
      - name: Full Python regression suite
        working-directory: experiments/carli-vision
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s . -p 'test_*.py' -v 2>&1 | tee python-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencv-python-test-log
          path: experiments/carli-vision/python-tests.log
